[workspace]
members = ["apps/server", "apps/editor/src-tauri"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.3"

[workspace.dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
